<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula CNW - Jogo Arcade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Meu Jogo Arcade Web</h1>
    </header>

    <main class="game-container">
        <!-- Tela/Canvas do Jogo -->
        <div id="game-screen">
            <p id="game-status">Pressione o botão para começar!</p>
        </div>

        <!-- Controlos Virtuais para Telemóvel / Mobile -->
        <div id="controles-mobile" class="controles-container">
            <div class="dpad">
                <button id="btn-cima" class="btn-touch">▲</button>
                <div class="dpad-meio">
                    <button id="btn-esquerda" class="btn-touch">◄</button>
                    <button id="btn-direita" class="btn-touch">►</button>
                </div>
                <button id="btn-baixo" class="btn-touch">▼</button>
            </div>
            <div class="botoes-acao">
                <button id="btn-acao" class="btn-touch btn-principal">A</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
