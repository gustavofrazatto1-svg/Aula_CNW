<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07090e">
  <title>Nexus Arcade — Mini Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="bg-canvas"></canvas>

  <div class="app-container">

    <!-- Cabeçalho -->
    <header class="main-header">
      <div class="logo-box">
        <i class="fa-solid fa-gamepad logo-icon"></i>
        <div>
          <h1>NEXUS<span>ARCADE</span></h1>
          <p class="tagline">10 mini games · recordes salvos no navegador</p>
        </div>
      </div>
      <div class="header-actions">
        <div class="stat-badge rank-badge" title="Seu rank (baseado nos pontos totais)">
          <i class="fa-solid fa-medal"></i><span id="rank-name">Novato</span>
        </div>
        <div class="stat-badge" title="Pontos totais (soma dos recordes)">
          <i class="fa-solid fa-trophy"></i><span id="global-score">0</span>
        </div>
        <button class="icon-btn sound-toggle" id="sound-toggle-btn" type="button" title="Ligar/desligar som" aria-label="Ligar ou desligar o som">
          <i class="fa-solid fa-volume-high"></i>
        </button>
        <button class="icon-btn" id="reset-scores-btn" type="button" title="Zerar recordes" aria-label="Zerar todos os recordes">
          <i class="fa-solid fa-trash"></i>
        </button>
      </div>
    </header>

    <!-- Hub -->
    <main id="hub-view">
      <nav class="nav-filters" aria-label="Categorias">
        <button class="filter-btn active" type="button" data-category="all">Todos</button>
        <button class="filter-btn" type="button" data-category="arcade">Arcade</button>
        <button class="filter-btn" type="button" data-category="puzzle">Puzzle</button>
        <button class="filter-btn" type="button" data-category="reflex">Reflexo</button>
      </nav>
      <section id="hub-grid" class="hub-grid" aria-label="Lista de jogos"></section>
    </main>

    <!-- Tela de jogo -->
    <section id="game-view" class="game-view hidden">
      <div class="game-header">
        <button id="back-btn" class="action-btn secondary" type="button"><i class="fa-solid fa-arrow-left"></i> <span>Voltar</span></button>
        <h2 id="current-game-title">Mini Game</h2>
        <div class="game-header-actions">
          <button id="pause-btn" class="action-btn secondary" type="button" title="Pausar (P)" aria-label="Pausar"><i class="fa-solid fa-pause"></i></button>
          <button id="restart-btn" class="action-btn secondary" type="button" title="Reiniciar" aria-label="Reiniciar"><i class="fa-solid fa-rotate-right"></i></button>
          <button class="action-btn secondary sound-toggle" type="button" title="Som" aria-label="Som"><i class="fa-solid fa-volume-high"></i></button>
        </div>
      </div>

      <div class="game-hud">
        <div class="hud-item">PONTOS <span id="live-score">0</span></div>
        <div class="hud-item">RECORDE <span id="live-highscore">0</span></div>
        <div class="hud-item"><em id="extra-label">EXTRA</em> <span id="live-extra">-</span></div>
      </div>

      <div id="stage" class="stage">
        <div id="canvas-container" class="canvas-container">
          <canvas id="game-canvas"></canvas>
        </div>

        <div id="custom-game-container" class="custom-game-container hidden">
          <div id="memory-grid" class="memory-grid hidden"></div>
          <div id="g2048-wrap" class="g2048-wrap hidden">
            <div id="g2048-grid" class="g2048-grid"></div>
          </div>
          <div id="simon-wrap" class="simon-wrap hidden">
            <p id="simon-status">—</p>
            <div id="simon-grid" class="simon-grid"></div>
          </div>
        </div>

        <div id="game-overlay" class="game-overlay">
          <div class="overlay-icon"><i id="overlay-icon" class="fa-solid fa-play"></i></div>
          <h2 id="overlay-title">PRONTO?</h2>
          <p id="overlay-msg">Pressione Iniciar para jogar</p>
          <p id="overlay-best" class="overlay-best"></p>
          <button id="start-game-btn" class="main-start-btn" type="button">INICIAR</button>
          <p id="overlay-controls" class="overlay-controls"></p>
        </div>
      </div>

      <p id="controls-hint" class="controls-hint"></p>
    </section>

    <footer class="main-footer">Feito com <i class="fa-solid fa-heart"></i> e JavaScript puro</footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
